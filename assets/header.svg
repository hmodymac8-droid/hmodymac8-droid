<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
<defs><linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#FFC300"/><stop offset="0.5" stop-color="#FFF3A0"/><stop offset="1" stop-color="#FFC300"/>
<animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/></linearGradient>
<clipPath id="r"><rect width="1000" height="200" rx="14"/></clipPath></defs>
<style>.w{fill:#FFD700;animation:l 3s infinite}.w:nth-child(2n){animation-delay:1.2s}.w:nth-child(3n){animation-delay:2.1s}@keyframes l{0%,100%{opacity:.9}50%{opacity:.1}}
.n{font:800 64px 'Segoe UI',Verdana,sans-serif;animation:u 1.4s ease-out both}.g{font:600 24px 'Segoe UI',Verdana,sans-serif;fill:#FFD700;opacity:0;animation:f 1s 1.2s forwards}
@keyframes u{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes f{to{opacity:1}}</style>
<g clip-path="url(#r)">
<rect width="1000" height="200" fill="#0a0a0c"/>
<g transform="translate(0,40)">
<path fill="#1a1a1f" d="M0,160 V110 h40 v-30 h30 v40 h25 v-60 h35 v50 h20 v-25 h40 v45 h30 v-70 h25 v70 h40 v-35 h30 v-20 h20 v55 h45 v-40 h35 v60 h30 v-80 h20 v80 h40 v-30 h35 v45 h25 v-55 h40 v40 h30 v-65 h25 v65 h45 v-30 h30 v50 h35 v-45 h40 v35 h30 v-60 h25 v70 h40 V160 Z"/>
<g><rect class="w" x="105" y="70" width="5" height="6"/><rect class="w" x="230" y="60" width="5" height="6"/><rect class="w" x="240" y="85" width="5" height="6"/><rect class="w" x="420" y="45" width="5" height="6"/><rect class="w" x="430" y="70" width="5" height="6"/><rect class="w" x="555" y="70" width="5" height="6"/><rect class="w" x="680" y="55" width="5" height="6"/><rect class="w" x="690" y="80" width="5" height="6"/><rect class="w" x="880" y="60" width="5" height="6"/><rect class="w" x="330" y="105" width="5" height="6"/><rect class="w" x="790" y="90" width="5" height="6"/></g>
</g>
</g>
<text x="500" y="100" text-anchor="middle" class="n" fill="url(#t)">Ahmed Hussain</text>
<text x="500" y="145" text-anchor="middle" class="g">It's okay, I'm Batman 🦇</text>
</svg>
