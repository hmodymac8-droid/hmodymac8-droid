<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
<defs><linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#FFC300"/><stop offset="0.5" stop-color="#FFF3A0"/><stop offset="1" stop-color="#FFC300"/>
<animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/></linearGradient></defs>
<style>.n{font:800 64px 'Segoe UI',Verdana,sans-serif;animation:r 1.4s ease-out both}.g{font:600 24px 'Segoe UI',Verdana,sans-serif;fill:#FFD700;opacity:0;animation:f 1s 1.2s forwards}
@keyframes r{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes f{to{opacity:1}}</style>
<rect width="1000" height="200" rx="14" fill="#0a0a0c"/>
<text x="500" y="100" text-anchor="middle" class="n" fill="url(#t)">Ahmed Hussain</text>
<text x="500" y="145" text-anchor="middle" class="g">It's okay, I'm Batman 🦇</text></svg>
